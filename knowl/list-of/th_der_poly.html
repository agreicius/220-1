<span class="type">Theorem</span><span class="space"> </span><span class="codenumber">12.8</span><span class="period">.</span><span class="space"> </span><span class="title">Derivative: polynomials.</span>
</h3>
<div class="para logical">
<div class="para">Given a polynomial <span class="process-math">\(f(x)=\anpoly\text{,}\)</span> where <span class="process-math">\(a_k\in \R\)</span> are fixed constants, we have</div>
<div class="displaymath process-math">
\begin{equation}
f'(x)=na_nx^{n-1}+(n-1)a_{n-1}x^{n-2}+\cdots +2a_2x+a_1\text{.}\tag{12.9}
\end{equation}
</div>
